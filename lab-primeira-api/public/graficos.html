<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Analytics | Gráficos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-light">

    <!-- Cabeçalho -->
    <header class="bg-dark text-white p-3 shadow-sm">

        <div class="container d-flex justify-content-between align-items-center">

            <h2 class="m-0">
                📈 Relatório de Cursos
            </h2>

            <a href="index.html"
               class="btn btn-outline-light btn-sm">
                ⬅ Voltar ao Painel
            </a>

        </div>

    </header>


    <!-- Conteúdo principal -->
    <main class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow border-0">

                    <div class="card-body">

                        <h4 class="card-title text-center text-muted mb-4">
                            Distribuição de Alunos por Curso
                        </h4>


                        <!-- Área do gráfico -->
                        <div style="position: relative; height:400px; width:100%">

                            <canvas id="graficoCursos"></canvas>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- JavaScript do gráfico -->
    <script src="graficos.js"></script>

</body>

</html>
