<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- 2.1 Codificação de Caracteres: Garante a renderização de acentos -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebApp Dashboard | SENAI</title>
    <!-- 2.3.6 Frameworks de Estilização: Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <!-- 2.2.2 HTML Semântico: Header (Cabeçalho) -->
    <header class="bg-primary text-white p-3 shadow-sm animacao-fade-in">
        <div class="container d-flex justify-content-between align-items-center">
            <h2 class="m-0">📊 Portal Analytics</h2>
            <span id="relogioSistema">00:00:00</span>
        </div>
    </header>
    <!-- 2.2.2 HTML Semântico: Main (Conteúdo Principal) -->
    <main class="container mt-4">
        <!-- Alerta para Falhas em Cascata do Lab 4 -->
        <div id="alertaSistema" class="alert alert-danger d-none" role="alert"></div>
        <!-- Seção 1: Indicadores (Métricas do Dashboard) -->
        <section class="row mb-4 animacao-slide-up" style="animation-delay: 0.2s;">

            <div class="col-md-4">
                <div class="card text-center shadow-sm border-0 indicador-card">
                    <div class="card-body">
                        <h5 class="card-title text-muted">Total de Alunos</h5>
                        <h1 class="display-4 text-primary fw-bold" id="metricaTotal">0</h1>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <!-- Formulário realocado para o Dashboard -->
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="w-100 form-group-custom">
                            <input type="text" id="inputNome" class="form-control" placeholder="Novo
Aluno..." required>
                            <select id="selectCurso" class="form-select">
                                <option value="Aplicações WEB">Aplicações WEB</option>
                                <option value="Framework Front End">Framework Front End</option>
                            </select>
                            <button id="btnCadastrar" class="btn btn-success">Adicionar</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Seção 2: Tabela de Dados -->
        <section class="card shadow-sm border-0 animacao-slide-up" style="animation-delay: 0.4s;">
            <div class="card-body">
                <h4 class="card-title mb-3">Registros Ativos</h4>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nome do Aluno</th>
                                <th>Curso</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaAlunos">
                            <!-- Injeção via DOM ocorrerá aqui -->
                        </tbody>
                    </table>

                </div>
            </div>
        </section>
    </main>
    <!-- Importação do comportamento da tela -->
    <script src="app.js"></script>
</body>

</html>
