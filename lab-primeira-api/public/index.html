<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Aluno 2.0</title>
    <!-- Importando o Framework Bootstrap via CDN -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f9;
            padding-top: 20px;
        }

        /* Media Query: Altera o layout se a tela for menor que 768px (Smartphones) */
        @media (max-width: 768px) {
            .form-group-custom {
                display: flex;
                flex-direction: column;
                /* Empilha os inputs no celular */
                gap: 15px;
            }

            .btn-custom {
                width: 100%;
            }
        }

        /* Layout normal para Desktops */
        @media (min-width: 769px) {
            .form-group-custom {
                display: flex;
                flex-direction: row;
                /* Coloca os inputs lado a lado no PC */
                gap: 10px;
            }

            .btn-custom {
                width: auto;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center text-primary mb-4">🎓 Portal de Aplicações Web (V2)</h1>
        <div class="card p-4 shadow-sm mb-4">
            <div class="form-group-custom">
                <input type="text" id="inputNome" class="form-control" placeholder="Nome do Aluno" required>
                <select id="selectCurso" class="form-control">
                    <option value="Aplicações WEB">Aplicações WEB</option>
                    <option value="Framework Front End">Framework Front End</option>

                </select>
                <button id="btnCadastrar" class="btn btn-success btn-custom">Cadastrar</button>
            </div>
            <!-- Alert para exibir falhas em cascata -->
            <div id="alertaSistema" class="alert alert-danger mt-3 d-none"></div>
        </div>
        <h3>Alunos Matriculados:</h3>
        <ul id="listaAlunos" class="list-group">
            <!-- Os alunos serão injetados aqui -->
        </ul>
    </div>
    <script src="app.js"></script>
</body>

</html>
